[project]
name = "skicrowd"
version = "0.1.0"
description = "Predict which Utah Ikon Pass resort will be least crowded on a given day"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
skicrowd = "skicrowd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skicrowd*"]

[tool.setuptools.package-data]
skicrowd = ["config/*.toml", "templates/*.html"]
