name: Collect crowd signals

# Self-scheduling: GitHub's cron never fired for this repo, so every run
# starts the next one. A run collects (during ski hours, 7am-5pm Mountain,
# Nov-Apr), waits for the next 20-minute slot, then dispatches the next run.
# Outside ski hours a run only waits and hands off, so the chain resumes at
# 7am. The cron below is kept as a backup: a scheduled run restarts the
# chain only if no other run is active.
#
# Each collecting run also rebuilds the live dashboard and publishes it to
# GitHub Pages (job `deploy`); `next` doesn't wait for it.
#
# To restart the chain: Actions -> Collect crowd signals -> Run workflow.
on:
  schedule:
    - cron: "7,27,47 14-23 * 1-4,11,12 *"
  workflow_dispatch:
    inputs:
      force:
        description: "Collect even outside ski hours"
        type: boolean
        default: true
      max_wait:
        description: "Testing: cap this run's wait before the handoff (seconds)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write        # lets a run dispatch the next one
  pages: write          # publish the dashboard (GitHub Pages)
  id-token: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      collect: ${{ steps.w.outputs.collect }}
    steps:
      - uses: actions/checkout@v4
      - id: w
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "collect=true" >> "$GITHUB_OUTPUT"
          else
            echo "collect=$(python3 -m skicrowd.schedule window)" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: gate
    if: needs.gate.outputs.collect == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collector.txt

      - name: Install
        run: pip install -r requirements-collector.txt

      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium

      - name: Install browser (for lift-status pages)
        run: python -m playwright install --with-deps chromium

      - name: Cache detector weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: frcnn-resnet50-fpn-v2-coco

      - name: Check out data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "skicrowd-collector"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir collector-data && cd collector-data
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin collector-data; then
            git checkout -q -b collector-data FETCH_HEAD
          else
            git checkout -q --orphan collector-data
          fi

      - name: Collect
        run: python -m skicrowd collect run --out collector-data

      - name: Commit data
        run: |
          cd collector-data
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push -q origin HEAD:collector-data && exit 0
            git pull -q --rebase origin collector-data
          done
          exit 1

      - name: Build dashboard
        run: python -m skicrowd dashboard --data collector-data --out site

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Publishes the dashboard. Needs Settings -> Pages -> Source: GitHub Actions.
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      # GitHub's Pages API sometimes returns 5xx for a minute; try twice.
      - id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying
        if: steps.d1.outcome == 'failure'
        run: sleep 60
      - id: d
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4

  next:
    # Runs even if collecting failed (so one bad run doesn't break the chain),
    # but not when the run is cancelled.
    needs: [gate, collect]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the next slot
        id: wait
        run: |
          w=$(python3 -m skicrowd.schedule wait)
          cap="${{ inputs.max_wait }}"
          if [ "$w" != "stop" ] && [ -n "$cap" ] && [ "$cap" -lt "$w" ]; then w="$cap"; fi
          echo "wait=$w" >> "$GITHUB_OUTPUT"
          if [ "$w" = "stop" ]; then echo "Ski season over; chain stops."; exit 0; fi
          echo "Sleeping ${w}s"; sleep "$w"
      - name: Start the next run
        if: steps.wait.outputs.wait != 'stop'
        run: |
          # GitHub's API occasionally returns 5xx; one failed call must not end
          # the chain (Nov 25 2026 it did). Keep trying for ~15 minutes.
          for i in $(seq 1 15); do
            # Only one chain: skip if another run is already queued or running.
            if others=$(gh run list -R "$GITHUB_REPOSITORY" --workflow collect.yml --limit 20 \
                          --json databaseId,status \
                          --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID}) | select(.status != \"completed\")] | length"); then
              if [ "$others" != "0" ]; then echo "Another run is active ($others); not dispatching."; exit 0; fi
            else
              echo "Couldn't list runs (attempt $i); dispatching anyway (the concurrency group keeps it to one chain)."
            fi
            if gh workflow run collect.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f force=false; then
              echo "Dispatched next run."; exit 0
            fi
            echo "Dispatch failed (attempt $i); retrying in 60s."
            sleep 60
          done
          echo "Could not dispatch the next run; the backup schedule or a manual run will restart the chain."
          exit 1
