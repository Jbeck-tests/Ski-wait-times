name: Collect crowd signals

# Every 20 minutes during ski hours (14-23 UTC = 7am-4pm MST / 8am-5pm MDT),
# November through April. Results are committed to the `collector-data`
# branch so the main branch history stays clean.
on:
  schedule:
    - cron: "7,27,47 14-23 * 1-4,11,12 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collector.txt

      - name: Install
        run: pip install -r requirements-collector.txt

      - name: Cache detector weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: frcnn-resnet50-fpn-v2-coco

      - name: Check out data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "skicrowd-collector"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir collector-data && cd collector-data
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin collector-data; then
            git checkout -q -b collector-data FETCH_HEAD
          else
            git checkout -q --orphan collector-data
          fi

      - name: Collect
        run: python -m skicrowd collect run --out collector-data

      - name: Commit data
        run: |
          cd collector-data
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push -q origin HEAD:collector-data && exit 0
            git pull -q --rebase origin collector-data
          done
          exit 1
