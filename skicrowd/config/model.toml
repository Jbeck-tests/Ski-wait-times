# ---------------------------------------------------------------------------
# Skier segments. `base` = intending skiers on a plain mid-season weekday.
# Calendar multipliers scale that up/down (weekends, holidays, school breaks).
# `travel_min` = free-flow drive (or shuttle) minutes to each resort.
# `affinity` = log-preference: season-pass ownership, loyalty, ski-only rules,
#              brand. 0 = neutral. Unlisted resorts get `affinity_default`.
# ---------------------------------------------------------------------------

[segments.slc_locals]
powder_canyons = ["LCC", "BCC"]   # where this group watches snow totals
label = "Salt Lake / Utah County locals"
kind = "local"
base = 9500
saturday = 2.8
sunday = 2.1                     # Utah Sundays are notably lighter than Saturdays
weekday_factors = [1.05, 0.93, 0.93, 1.0, 1.2]   # Mon..Fri (long-weekend Fridays)
school_break = 1.9
powder_participation = 0.055     # +5.5% intending skiers per inch of new snow
powder_participation_cap = 1.9
beta_powder = 0.060              # choice sensitivity to resort-level powder (per inch)
beta_travel = 1.6                # utility per hour of travel
home_utility = -2.0              # outside option ("not today")
affinity_default = -0.5
[segments.slc_locals.travel_min]
alta = 40
snowbird = 37
brighton = 45
solitude = 40
deer_valley = 45
snowbasin = 60
park_city = 40
powder_mountain = 80
[segments.slc_locals.affinity]
alta = 0.85
snowbird = 1.05
brighton = 1.25
solitude = 0.35
deer_valley = -0.35
snowbasin = 0.15
park_city = 0.45
powder_mountain = -0.4

[segments.ogden_locals]
powder_canyons = ["OGDEN"]   # where this group watches snow totals
label = "Ogden / Davis / Weber locals"
kind = "local"
base = 2300
saturday = 2.8
sunday = 2.0
weekday_factors = [1.05, 0.93, 0.93, 1.0, 1.2]
school_break = 1.8
powder_participation = 0.05
powder_participation_cap = 1.8
beta_powder = 0.05
beta_travel = 1.6
home_utility = -2.0
affinity_default = -0.3
[segments.ogden_locals.travel_min]
alta = 70
snowbird = 67
brighton = 75
solitude = 70
deer_valley = 65
snowbasin = 28
park_city = 60
powder_mountain = 35
[segments.ogden_locals.affinity]
snowbasin = 1.5
powder_mountain = 0.9
snowbird = 0.2
alta = 0.1
brighton = 0.0

[segments.pc_locals]
powder_canyons = ["PC"]   # where this group watches snow totals
label = "Park City / Summit / Wasatch County locals"
kind = "local"
base = 2600
saturday = 2.0
sunday = 1.8
weekday_factors = [1.05, 0.95, 0.95, 1.0, 1.15]
