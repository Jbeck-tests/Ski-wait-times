# ---------------------------------------------------------------------------
# skicrowd model configuration
#
# Every number in this file is an ESTIMATE assembled from public information
# (resort stats, USFS master-plan style capacity figures, typical drive
# times, widely reported crowd patterns). None of it is official attendance
# data — no Utah resort publishes daily skier counts. Treat these values as
# priors: `skicrowd calibrate` re-fits the important ones against real
# observations (your own logs, wait times, UDOT canyon traffic counts, etc.).
# ---------------------------------------------------------------------------

[meta]
timezone = "America/Denver"
# Seasons are labelled by the year they end: 2025 == the 2024-25 season.
history_first_season = 2017
history_last_season = 2026

# ---------------------------------------------------------------------------
# Resorts. `ikon = true` resorts are the ones ranked for you. The others are
# modelled because they compete for the same skiers (if Park City Mountain
# did not exist, Deer Valley would be far busier).
#
# capacity      = comfortable skiers-at-one-time style capacity (people/day
#                 the mountain absorbs before lift lines grow fast).
# hard_cap      = practical daily ceiling from parking reservations or
#                 ticket limits; excess demand is pushed to other resorts.
# snowmaking    = lowers the natural-snow depth needed to open.
# powder_bonus  = extra pull on powder days (reputation effect).
# canyon        = shared access road that can congest or close.
# station       = SNOTEL station used for snow/temperature history.
# ---------------------------------------------------------------------------

[resorts.alta]
name = "Alta"
ikon = true
canyon = "LCC"
station = "766:UT:SNTL"          # Snowbird SNOTEL (2.7 km); Atwater only since 2022
capacity = 6500
hard_cap = 8500
open_mmdd = "11-22"
close_mmdd = "04-19"
open_depth_in = 30
snowmaking = false
powder_bonus = 0.45

[resorts.snowbird]
name = "Snowbird"
ikon = true
canyon = "LCC"
station = "766:UT:SNTL"
capacity = 9500
hard_cap = 12000
open_mmdd = "11-20"
close_mmdd = "05-25"
open_depth_in = 24
snowmaking = true
powder_bonus = 0.40

[resorts.brighton]
name = "Brighton"
# Night skiing 4-9pm (typical schedule, estimate): mid-Dec to late March, Mon-Sat
night_skiing = { start_mmdd = "12-12", end_mmdd = "03-28", weekdays = [0, 1, 2, 3, 4, 5] }
ikon = true
canyon = "BCC"
station = "366:UT:SNTL"
capacity = 5800
hard_cap = 8000
open_mmdd = "11-15"
close_mmdd = "04-19"
open_depth_in = 22
snowmaking = true
powder_bonus = 0.20

[resorts.solitude]
