# ---------------------------------------------------------------------------
# Global behaviour
# ---------------------------------------------------------------------------
[behaviour]
beta_crowd = 1.1          # utility penalty per unit of load (1.0 == at capacity)
cold_temp_f = 10          # ski-hours mean temp below this suppresses locals
cold_factor = 0.82
very_cold_temp_f = 0
very_cold_factor = 0.62
rain_factor = 0.8         # warm precip day
thin_base_in = 36         # below this base depth locals are less keen
thin_base_factor = 0.75
wind_gust_mph = 45        # forecast-only: high wind holds lifts
wind_capacity_factor = 0.8
wind_participation_factor = 0.85
cap_shadow_step = 0.6     # how hard a hard cap pushes demand away
# SNOTEL gauges under-read what resorts report (wind undercatch, lower
# elevation). Skiers react to the snow report, so scale station snow up.
snow_report_factor = 1.25
# How strongly a group's skiing drops when the resorts it normally uses are
# closed (1 = proportionally; 0 = everyone just goes elsewhere).
pass_lockin_local = 0.9
pass_lockin_destination = 0.5

# Seasonal enthusiasm curve for locals (month -> multiplier)
[behaviour.local_month_factor]
11 = 1.15
12 = 1.10
1 = 1.0
2 = 1.0
3 = 0.92
4 = 0.6
5 = 0.3

# ---------------------------------------------------------------------------
# Canyon roads. Morning person-capacity before the "red snake" forms, a
# BPR-style congestion curve, plus storm closures (avalanche control /
# interlodge) driven by 24h snowfall at the canyon's station.
# ---------------------------------------------------------------------------
[canyons.LCC]
station = "766:UT:SNTL"
free_flow_min = 20
person_capacity = 13000
car_share = 0.85
bpr_alpha = 1.0
bpr_beta = 4.0
closure_snow_in = 14
closure_spread_in = 4
closure_delay_min = 60

[canyons.BCC]
station = "366:UT:SNTL"
free_flow_min = 22
person_capacity = 12500
car_share = 0.88
bpr_alpha = 0.8
bpr_beta = 4.0
closure_snow_in = 18
closure_spread_in = 4
closure_delay_min = 35

[canyons.PC]
station = "814:UT:SNTL"
free_flow_min = 0
person_capacity = 60000
car_share = 0.7
bpr_alpha = 0.3
bpr_beta = 4.0
closure_snow_in = 99
closure_spread_in = 4
closure_delay_min = 0

[canyons.OGDEN]
station = "332:UT:SNTL"
free_flow_min = 0
person_capacity = 30000
car_share = 0.95
bpr_alpha = 0.3
bpr_beta = 4.0
closure_snow_in = 22
closure_spread_in = 5
closure_delay_min = 25

# ---------------------------------------------------------------------------
# Time of day (skicrowd/intraday.py). On-mountain occupancy by hour is
# measured from UDOT up/down canyon counts; these two convert it to lift-line
# pressure and are re-fitted from webcam lift-line counts once collected.
# ---------------------------------------------------------------------------
[intraday]
base_rush = 1.0           # extra weight on skiers arriving that hour (base-lift crush)
# Share of on-mountain skiers actually riding lifts / in lines in each hour
# block (lunch, breaks, fatigue). Estimates until webcam lift-line counts
# re-fit them (`python -m skicrowd intraday fit`).
[intraday.activity]
9 = 1.0
10 = 1.0
11 = 0.95
12 = 0.78
13 = 0.85
14 = 0.86
15 = 0.78
