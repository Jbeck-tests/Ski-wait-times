hard_cap = 12000                  # Deer Valley limits daily ticket sales
hard_cap_by_season = { 2026 = 14500, 2027 = 15000 }
open_mmdd = "12-06"
close_mmdd = "04-19"
open_depth_in = 20
snowmaking = true
powder_bonus = 0.05

[resorts.snowbasin]
name = "Snowbasin"
ikon = true
canyon = "OGDEN"
station = "332:UT:SNTL"          # Ben Lomond Peak (closest long-record SNOTEL)
