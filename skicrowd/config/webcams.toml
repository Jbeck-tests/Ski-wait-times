# Webcams the collector reads. Frames come from Ski Utah's public webcam page
# (one still image per camera, refreshed every few minutes). Cameras are found
# by resort section + camera title, so if Ski Utah renumbers an image the
# collector still finds it.
#
# kind:
#   lift_line  people queued at a lift          -> counts people
#   base       base area / plaza                -> counts people
#   parking    parking lot                      -> counts vehicles
#   road       canyon road / intersection       -> counts vehicles (red snake)
#
# lift (optional): the lift this camera's queue belongs to, as named on the
# resort's lift-status page. Counts taken while that lift is closed are kept
# in the log but ignored for training.
#
# roi (optional): polygon in 0-1 image coordinates [[x,y], ...]; only
# detections whose centre falls inside count. Add these once in-season frames
# show where the queue or lot actually is.

